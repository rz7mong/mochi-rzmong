<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Studio tema - Mochi rzmong</title>
<link rel="stylesheet" href="./studio.css?v=7"/>
</head>
<body>
<header>
  <div class="kicker">studio · rzmong · v0.5.1</div>
  <h1>Studio + Upload</h1>
  <p class="hint">Target GIF max 599 KB. Tries longer duration first (up to 8s), then lowers quality.</p>
  <p class="hint warn">Upload: Wi-Fi rzmong mochi / rzmong123 · firmware 0.5.1 + SD</p>
  <p><a href="index.html">Install</a> · <a href="pengaturan.html">Settings</a> · <a href="panduan.html">Guide</a></p>
</header>
<main>
<div class="card">
  <label>Mochi address (AP)</label>
  <input id="host" value="http://192.168.4.1"/>
  <div class="row"><button type="button" class="sec" id="btnPing">Test connection</button></div>
  <p id="pingst" class="hint"></p>
</div>
<div class="card">
  <label>Theme folder</label>
  <input id="tema" value="wajah" list="temalist"/>
  <datalist id="temalist">
    <option value="wajah"/><option value="gundam"/><option value="mobil"/>
    <option value="polisi"/><option value="musik"/><option value="neon"/>
    <option value="anime"/><option value="makanan"/><option value="intro"/>
  </datalist>
  <label>File name (no extension)</label>
  <input id="stem" value="yelling"/>
  <label>Video (GIF up to ~8s if under 599 KB)</label>
  <input type="file" id="vid" accept="video/*,image/gif,.gif,.mp4,.webm,.mov"/>
  <label>Sound optional (overrides video audio)</label>
  <input type="file" id="sfx" accept="audio/*,.mp3,.wav,.m4a,.ogg"/>
  <button id="btnConvert">1. Convert and Preview</button>
  <p id="status" class="hint"></p>
  <div id="log"></div>
  <div id="previewBox" class="preview-box">
    <div class="hint">Preview</div>
    <img id="previewGif" alt="preview" style="display:none"/>
    <div id="audioMeta" class="meta" style="display:none"></div>
    <div id="sizeMeta" class="meta"></div>
    <div class="row">
      <button type="button" class="blue" id="btnSave">2. Save to device</button>
      <button type="button" class="ok" id="btnUpload">3. Upload to Mochi</button>
    </div>
  </div>
</div>
</main>
<footer>rzmong · MIT · v0.5.1 · GIF max 599 KB · longer duration first</footer>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="./studio.app.js?v=20260930f"></script>
</body>
</html>
