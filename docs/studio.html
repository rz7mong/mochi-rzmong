<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>🎨 Studio tema — Mochi rzmong</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#2a3140;--ink:#eef2f7;--muted:#8b95a7;--warn:#ffb86c}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header,main,footer{max-width:900px;margin:0 auto;padding:0 22px}header{padding-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.warn{color:var(--warn)}.hint{color:var(--muted);font-size:13px;line-height:1.5}
a{color:#54a0ff}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#10141b;color:var(--ink)}
button{background:#ff6b6b;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;margin-top:12px}
pre{background:#10141b;padding:12px;border-radius:10px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="kicker">studio · rzmong · v0.2.8</div>
  <h1>🎨 Studio tema</h1>
  <p class="warn">⚠️ MP4 tidak diputar di perangkat — konversi ke GIF 240×240. MP3 tidak di-decode — SFX harus WAV 16-bit.</p>
  <p class="hint">Pack: <a href="https://github.com/rz7mong/mochi-rzmong/releases/tag/assets-v1">assets-v1</a>. Default tema di <a href="pengaturan.html">Pengaturan</a> (Wi-Fi <code>rzmong mochi</code> / <code>rzmong123</code>).</p>
  <p><a href="index.html">Instalasi</a> · <a href="pengaturan.html">Pengaturan</a> · <a href="panduan.html">Panduan</a></p>
</header>
<main>
<div class="card">
  <label>Nama tema (folder)</label>
  <input id="tema" value="wajah"/>
  <label>Nama file GIF (tanpa .gif)</label>
  <input id="stem" value="yelling"/>
  <label>Catatan</label>
  <textarea id="note" rows="3">GIF 240×240, loop. SFX: /sfx/&lt;tema&gt;/&lt;stem&gt;.wav</textarea>
  <button type="button" onclick="gen()">Buat skrip ffmpeg</button>
  <pre id="out"></pre>
</div>
</main>
<footer style="color:#8b95a7;padding:20px">© rzmong · MIT · v0.2.8</footer>
<script>
function gen(){
  const t=document.getElementById('tema').value.trim()||'wajah';
  const s=document.getElementById('stem').value.trim()||'clip';
  let out='# Konversi video → GIF (wajib jika sumber MP4):\n';
  out += `ffmpeg -i input.mp4 -vf "scale=240:240:force_original_aspect_ratio=decrease,pad=240:240:(ow-iw)/2:(oh-ih)/2" -loop 0 gif/${t}/${s}.gif\n`;
  out += '# SFX: WAV 16-bit (MP3 tidak diputar di ESP32-C3)\n';
  out += `ffmpeg -i sfx_in.wav -acodec pcm_s16le -ar 22050 -ac 1 sfx/${t}/${s}.wav\n`;
  out += `# Letakkan di root SD: gif/${t}/${s}.gif dan sfx/${t}/${s}.wav\n`;
  document.getElementById('out').textContent=out;
}
</script>
</body>
</html>
