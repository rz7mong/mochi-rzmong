<!DOCTYPE html><html lang=id><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>⚙️ Pengaturan — Mochi rzmong</title>
<style>:root{--bg:#0e1116;--card:#171b22;--line:#2a3140;--ink:#eef2f7;--muted:#8b95a7;--acc:#ff6b6b}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui;background:var(--bg);color:var(--ink)}header,main,footer{max-width:860px;margin:0 auto;padding:0 22px}header{padding-top:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#10141b;color:var(--ink)}.tog{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--acc)}.wm{position:fixed;right:14px;bottom:10px;opacity:.28;letter-spacing:.18em;text-transform:uppercase;font-size:12px}</style></head>
<body><div class=wm>rzmong</div>
<header><h1>⚙️ Pengaturan Mochi</h1><p>Sambung Wi-Fi <code>Mochi-rzmong</code> / sandi <code>rzmong24</code>. <a href=index.html style=color:#54a0ff>🍡 Instalasi</a></p></header>
<main>
<div class=card><label>🌐 Alamat Mochi</label><input id=host value=http://192.168.4.1><p id=st></p><button onclick=ping()>🔗 Tes koneksi</button></div>
<div class=card><h3>🖼️ Sumber gambar</h3>
<select id=storage><option value=flash>💾 Flash — GIF bawaan</option><option value=sd>💿 Kartu SD</option></select>
<label>🎬 GIF bawaan</label>
<select id=defgif><option value=yelling>wajah</option><option value=car>mobil</option><option value=intro_3>intro</option></select>
</div>
<div class=card><h3>👆 Reaksi sentuh</h3>
<label>Mode</label>
<select id=rmode><option value=acak>🎲 Acak tiap sentuh</option><option value=tetap>🔒 Tetap satu model</option></select>
<label>Model tetap</label>
<select id=react>
<option value=0>tickle o_o</option><option value=1>kedip -_-</option>
<option value=2>cinta <3</option><option value=3>marah >_<</option>
<option value=4>ketawa ^_^</option><option value=5>nangis T_T</option>
<option value=6>ngantuk u_u</option><option value=7>kaget O_O</option>
<option value=8>kedip-satu ^_o</option><option value=9>cemberut :*</option>
</select>
</div>
<div class=card><h3>🎨 Tema SD</h3><div class=chips id=chips></div>
<label>Mode putar</label><select id=mode><option value=kategori>📁 Tetap kategori</option><option value=acak>🎲 Acak semua</option><option value=acak_tema>🔀 Acak dalam tema</option></select></div>
<div class=card><h3>🔊 Suara</h3>
<div class=tog><span>SFX / jingle</span><input type=checkbox id=sound checked></div>
<label>Volume 0-21</label><input id=vol type=number min=0 max=21 value=12>
</div>
<div class=card><h3>✨ Lainnya</h3>
<div class=tog><span>🗺️ Chronos</span><input type=checkbox id=chrono></div>
<div class=tog><span>🏷️ Merek rzmong di LCD</span><input type=checkbox id=wm checked></div></div>
<p><button onclick=simpan()>💾 Simpan ke Mochi</button></p>
</main><footer style=color:#8b95a7;padding:24px>© rzmong · v0.2.2</footer>
<script>
const TEMAS=['wajah','gundam','mobil','neon','anime','makanan','musik','intro'];let tema='wajah';
const chips=document.getElementById('chips');
TEMAS.forEach(t=>{const b=document.createElement('div');b.className='chip'+(t===tema?' on':'');b.textContent=t;b.onclick=()=>{tema=t;[...chips.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');};chips.appendChild(b);});
async function ping(){const h=document.getElementById('host').value.replace(/\/$/,'');try{const j=await(await fetch(h+'/api/status')).json();document.getElementById('st').textContent='OK '+JSON.stringify(j);}catch(e){document.getElementById('st').textContent='Sambung Wi-Fi Mochi-rzmong';}}
async function simpan(){const h=document.getElementById('host').value.replace(/\/$/,'');const body={theme:tema,play_mode:document.getElementById('mode').value,react_mode:document.getElementById('rmode').value,react:+document.getElementById('react').value,sound:document.getElementById('sound').checked,volume:+document.getElementById('vol').value,storage:document.getElementById('storage').value,default_gif:document.getElementById('defgif').value,chronos:document.getElementById('chrono').checked,brand:'rzmong'};try{const r=await fetch(h+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('st').textContent=r.ok?'Tersimpan':'Gagal';}catch(e){document.getElementById('st').textContent='Tersimpan lokal (Mochi offline)';console.log(body);}}
</script></body></html>
