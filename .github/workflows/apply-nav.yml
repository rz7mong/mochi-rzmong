name: Apply Chronos nav
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nav.yml'
      - 'firmware/tools/patch_nav.py'
      - 'firmware/include/chronos_ui.inc'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch main + version
        run: |
          python3 firmware/tools/patch_nav.py
          sed -i 's/MOCHI_VERSION "0\.[0-9]*\.[0-9]*"/MOCHI_VERSION "0.5.0"/' firmware/include/MochiRzmong.h || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/main.cpp firmware/include/MochiRzmong.h firmware/include/chronos_ui.inc
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "feat(firmware): Chronos navigation + unique touch gestures (v0.5.0)"
            git push
          fi
