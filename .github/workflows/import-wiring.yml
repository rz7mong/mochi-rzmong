name: Refresh wiring diagram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagram is committed
        run: |
          test -f docs/wiring-0.5.1.jpg
          echo "docs/wiring-0.5.1.jpg is the firmware 0.5.1 diagram. Do not reimport the old catbox file."
          sha256sum docs/wiring-0.5.1.jpg
