name: Apply v0.5.1 main fixes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-051.yml'
      - 'firmware/tools/patch_051.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch main.cpp
        run: |
          python3 firmware/tools/patch_051.py
          grep -q serviceNet firmware/src/main.cpp
          grep -q HTTP_OPTIONS firmware/src/main.cpp
          ! grep -q ap_pass firmware/src/main.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/main.cpp
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix(firmware): v0.5.1 serviceNet, CORS, touch, no ap_pass"
            git push
          fi
