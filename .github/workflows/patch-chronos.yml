name: Patch Chronos full
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-chronos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Chronos full integration
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('firmware/src/main.cpp')
          main = p.read_text()
          if 'onChronosNotif' in main and 'chronosApply' in main:
              print('already has Chronos full')
              raise SystemExit(0)
          if len(main) < 10000:
              raise SystemExit('main.cpp too small — restore first')

          main = main.replace(
              'ChronosESP32 watch; Preferences prefs;',
              'ChronosESP32 watch("rzmong", CF_ESP32_240x240); Preferences prefs;')
          main = main.replace(
              'WebServer server(80); DNSServer dnsServer; ChronosESP32 watch; Preferences prefs;',
              'WebServer server(80); DNSServer dnsServer; ChronosESP32 watch("rzmong", CF_ESP32_240x240); Preferences prefs;')

          if 'notifUntil' not in main:
              main = main.replace(
                  'bool soundOn=true, useSd=false, chronosOn=false, showWm=true;',
                  'bool soundOn=true, useSd=false, chronosOn=false, showWm=true;\nbool chronoConn=false, ringerOn=false;\nString notifApp, notifTitle, notifMsg, ringerName;\nuint32_t notifUntil=0;')

          block = r'''
// ===== Chronos BLE full (ESP32-C3 Super Mini) =====
void drawChronosNotif(){
  tft.fillScreen(C_BG);
  tft.fillRect(0,0,240,36,C_TEAL);
  tft.setTextColor(TFT_BLACK,C_TEAL);
  tft.drawCentreString(notifApp.length()?notifApp.c_str():"Notifikasi",120,8,2);
  tft.setTextColor(C_TEXT,C_BG);
  tft.drawString(notifTitle,12,50,2);
  tft.setTextColor(C_DIM,C_BG);
  String m=notifMsg;
  if(m.length()>36){ tft.drawString(m.substring(0,36),12,80,1); tft.drawString(m.substring(36,72),12,96,1); }
  else tft.drawString(m,12,80,1);
  if(chronoConn){
    char tbuf[24]="--:--";
    String td=watch.getTimeDate();
    if(td.length()>=5){ td.substring(0,5).toCharArray(tbuf,24); }
    tft.drawCentreString(tbuf,120,210,2);
  }
}
void drawChronosRinger(){
  tft.fillScreen(C_BG);
  tft.fillRoundRect(20,60,200,100,16,C_RED);
  tft.setTextColor(TFT_WHITE,C_RED);
  tft.drawCentreString("Panggilan",120,80,2);
  tft.drawCentreString(ringerName.length()?ringerName.c_str():"...",120,110,2);
}
void onChronosConn(bool state){
  chronoConn=state;
  Serial.printf("[chronos] %s\n", state?"connected":"disconnected");
  if(state) watch.setBattery(100, false);
}
void onChronosNotif(Notification n){
  notifApp=n.app; if(notifApp.length()>22) notifApp=notifApp.substring(0,22);
  notifTitle=n.title; if(notifTitle.length()>28) notifTitle=notifTitle.substring(0,28);
  notifMsg=n.message; if(notifMsg.length()>72) notifMsg=notifMsg.substring(0,72);
  notifUntil=millis()+6000;
  playJingleMs(180);
}
void onChronosRinger(String caller, bool state){
  ringerOn=state;
  ringerName=caller; if(ringerName.length()>24) ringerName=ringerName.substring(0,24);
  if(state) playJingleMs(500);
}
void onChronosConfig(Config config, uint32_t a, uint32_t b){
  if(config==CF_FIND){
    playJingleMs(700);
    for(int i=0;i<3;i++){ tft.fillScreen(C_YEL); delay(120); tft.fillScreen(C_BG); delay(80); }
  } else if(config==CF_TIME){
    Serial.printf("[chronos] time %s\n", watch.getTimeDate().c_str());
  }
}
void chronosSetupCallbacks(){
  watch.setConnectionCallback(onChronosConn);
  watch.setNotificationCallback(onChronosNotif);
  watch.setRingerCallback(onChronosRinger);
  watch.setConfigurationCallback(onChronosConfig);
}
void chronosApply(){
  if(chronosOn){
    if(!watch.isRunning()){
      chronosSetupCallbacks();
      watch.begin();
      Serial.printf("[chronos] BLE on mac=%s\n", watch.getAddress().c_str());
    }
  } else {
    chronoConn=false; ringerOn=false; notifUntil=0;
    if(watch.isRunning()) watch.stop();
    Serial.println("[chronos] BLE off");
  }
}

'''
          if 'onChronosNotif' not in main:
              main = main.replace('void brandMark()', block + 'void brandMark()')

          main = main.replace(
              'else if(menuRow==11){chronosOn=!chronosOn; savePrefs(); showInfo("chronos",chronosOn?"ON":"OFF");}',
              'else if(menuRow==11){chronosOn=!chronosOn; savePrefs(); chronosApply(); showInfo("Chronos",chronosOn?(chronoConn?"ON linked":"ON pair app"):"OFF");}')

          main = main.replace(
              'char foot[56]; snprintf(foot,56,"%d/%d vol%d %s",menuRow+1,NMENU,volume,useSd&&sdOk?"SD":"flash");',
              'char foot[64]; snprintf(foot,64,"%d/%d vol%d %s%s",menuRow+1,NMENU,volume,useSd&&sdOk?"SD":"flash", chronosOn?(chronoConn?" BLE*":" BLE"):"");')

          main = main.replace(
              'd["chronos"]=chronosOn;',
              'd["chronos"]=chronosOn;\n  d["chronos_conn"]=chronosOn && watch.isConnected();\n  d["chronos_run"]=chronosOn && watch.isRunning();\n  if(chronosOn && watch.isRunning()) d["chronos_mac"]=watch.getAddress();\n  if(chronosOn && chronoConn) d["chronos_time"]=watch.getTimeDate();')

          main = main.replace(
              'if(d["chronos"].is<bool>()) chronosOn=d["chronos"];',
              'if(d["chronos"].is<bool>()){ chronosOn=d["chronos"]; chronosApply(); }')

          main = main.replace(
              '  if(chronosOn) watch.begin();\n}',
              '  chronosSetupCallbacks();\n  if(chronosOn) chronosApply();\n}')

          old_loop = '''void loop(){\n  dnsServer.processNextRequest();\n  server.handleClient(); if(chronosOn) watch.loop();\n  bool down=digitalRead(MOCHI_PIN_TOUCH)==HIGH;\n  if(ui==UI_MENU){\n    if(down&&!prevDown) downAt=millis();\n    if(!down&&prevDown){ uint32_t held=millis()-downAt; if(held>=900){soundOn=!soundOn;savePrefs();} else {taps++; lastTap=millis();} }\n    prevDown=down; finishTaps(); drawMenu(); delay(35); return;\n  }\n  finishTaps(); playCurrent();\n}'''
          new_loop = '''void loop(){\n  dnsServer.processNextRequest();\n  server.handleClient();\n  if(chronosOn) watch.loop();\n  if(chronosOn && ringerOn){\n    drawChronosRinger();\n    bool down=digitalRead(MOCHI_PIN_TOUCH)==HIGH;\n    if(down&&!prevDown) ringerOn=false;\n    prevDown=down; delay(40); return;\n  }\n  if(chronosOn && notifUntil && (int32_t)(millis()-notifUntil)<0){\n    drawChronosNotif();\n    bool down=digitalRead(MOCHI_PIN_TOUCH)==HIGH;\n    if(down&&!prevDown) notifUntil=0;\n    prevDown=down; delay(40); return;\n  } else if(notifUntil && (int32_t)(millis()-notifUntil)>=0){\n    notifUntil=0;\n  }\n  bool down=digitalRead(MOCHI_PIN_TOUCH)==HIGH;\n  if(ui==UI_MENU){\n    if(down&&!prevDown) downAt=millis();\n    if(!down&&prevDown){ uint32_t held=millis()-downAt; if(held>=900){soundOn=!soundOn;savePrefs();} else {taps++; lastTap=millis();} }\n    prevDown=down; finishTaps(); drawMenu(); delay(35); return;\n  }\n  finishTaps(); playCurrent();\n}'''
          if 'drawChronosRinger();' not in main:
              if old_loop not in main:
                  raise SystemExit('loop block not found for Chronos patch')
              main = main.replace(old_loop, new_loop)

          main = main.replace('0.4.8 — captive DNS', '0.4.9 — Chronos full + captive DNS')
          p.write_text(main)
          print('patched bytes', len(main))
          PY
          # bump version header if needed
          sed -i 's/MOCHI_VERSION "0.4.[0-9]"/MOCHI_VERSION "0.4.9"/' firmware/include/MochiRzmong.h || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/main.cpp firmware/include/MochiRzmong.h
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "feat(firmware): Chronos full — notif, call, find, time (v0.4.9)"
            git push
          fi
