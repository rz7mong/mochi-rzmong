name: Build firmware.bin
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build ESP32-C3
        working-directory: firmware
        run: pio run -e esp32-c3-super-mini
      - name: Copy bin into docs/firmware
        run: |
          mkdir -p docs/firmware
          cp firmware/.pio/build/esp32-c3-super-mini/firmware.bin docs/firmware/firmware.bin
          ls -la docs/firmware/
      - name: Commit firmware.bin
        run: |
          git config user.name "rzmong-bot"
          git config user.email "rz7mong@users.noreply.github.com"
          git add docs/firmware/firmware.bin
          git diff --cached --quiet && echo "no bin change" && exit 0
          git commit -m "build: firmware.bin rzmong"
          git push
