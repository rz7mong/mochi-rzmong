name: Build firmware.bin
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - 'PRODUCT.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version consistency
        run: |
          VER=$(grep -oP '#define MOCHI_VERSION\s+"\K[^"]+' firmware/include/MochiRzmong.h)
          echo "header=$VER"
          grep -q "MOCHI_VERSION \"$VER\"" firmware/include/MochiRzmong.h
          if [ -f PRODUCT.md ]; then
            grep -q "$VER" PRODUCT.md || { echo "PRODUCT.md missing $VER"; exit 1; }
          fi
          if [ -f README.md ]; then
            grep -q "$VER" README.md || echo "warn: README.md may not mention $VER (allowed if PRODUCT-only)"
          fi
      - name: Install tools
        run: pip install -U platformio pillow esptool
      - name: Embed default GIF + jingle
        run: python firmware/tools/embed_assets.py
      - name: Build ESP32-C3
        working-directory: firmware
        run: pio run -e esp32-c3-super-mini
      - name: Merge flash image
        run: |
          B=firmware/.pio/build/esp32-c3-super-mini
          ls -la "$B"
          BOOTAPP=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -1)
          echo "boot_app0=$BOOTAPP"
          python -m esptool --chip esp32c3 merge_bin -o docs/firmware/firmware.bin --flash_mode dio --flash_size 4MB \
            0x0 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOTAPP" \
            0x10000 "$B/firmware.bin"
          ls -la docs/firmware/firmware.bin
          VER=$(grep -oP '#define MOCHI_VERSION\s+"\K[^"]+' firmware/include/MochiRzmong.h || echo "0.0.0")
          echo "MOCHI_VERSION=$VER"
          python -c "import json; p='docs/firmware/manifest.json'; d=json.load(open(p)); d['version']='$VER'; d['name']='Mochi rzmong'; json.dump(d, open(p,'w'), indent=2); print('manifest', d['version'])"
          echo "$VER" > /tmp/mochi_ver.txt
      - name: Commit firmware.bin
        run: |
          VER=$(cat /tmp/mochi_ver.txt)
          git config user.name "rzmong-bot"
          git config user.email "rz7mong@users.noreply.github.com"
          git add docs/firmware/firmware.bin docs/firmware/manifest.json
          git diff --cached --quiet && echo "no bin change" && exit 0
          git commit -m "build: firmware.bin v${VER}"
          git pull --rebase origin main || true
          git push origin HEAD:main
