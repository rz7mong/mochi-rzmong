name: Restore main.cpp
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch main.cpp if truncated
        run: |
          set -e
          SIZE=$(wc -c < firmware/src/main.cpp || echo 0)
          echo "current main.cpp size=$SIZE"
          if [ "$SIZE" -lt 10000 ]; then
            echo "Restoring from e16d600..."
            git show e16d60087eba008025ae9c33fb73e35de27e81ef:firmware/src/main.cpp > firmware/src/main.cpp
          fi
          python3 << 'PY'
          from pathlib import Path
          main = Path("firmware/src/main.cpp").read_text()
          if "dnsServer.start" in main and "handleCaptiveProbe" in main:
              print("already patched")
              raise SystemExit(0)
          if "#include <DNSServer.h>" not in main:
              main = main.replace("#include <WebServer.h>", "#include <WebServer.h>\n#include <DNSServer.h>")
          if "DNSServer dnsServer" not in main:
              main = main.replace(
                  "WebServer server(80); ChronosESP32",
                  "WebServer server(80); DNSServer dnsServer; ChronosESP32")
          old = """void handleRoot(){\n  server.sendHeader(\"Cache-Control\",\"no-store\");\n  server.send_P(200,\"text/html\",CAPTIVE_HTML);\n}"""
          new = """void handleRoot(){\n  server.sendHeader(\"Cache-Control\",\"no-store\");\n  server.send_P(200,\"text/html; charset=utf-8\",CAPTIVE_HTML);\n}\nvoid handleCaptiveProbe(){\n  server.sendHeader(\"Cache-Control\",\"no-store\");\n  server.send_P(200,\"text/html; charset=utf-8\",CAPTIVE_HTML);\n}\nvoid handleNotFound(){\n  server.sendHeader(\"Location\", String(\"http://\")+WiFi.softAPIP().toString()+\"/\", true);\n  server.send(302,\"text/plain\",\"\");\n}"""
          if "handleCaptiveProbe" not in main:
              if old not in main:
                  raise SystemExit("handleRoot block not found")
              main = main.replace(old, new)
          old_s = """  apPass = MOCHI_AP_PASS;\n  WiFi.softAP(MOCHI_AP_NAME, MOCHI_AP_PASS);\n  server.on(\"/\",handleRoot);\n  server.on(\"/index.html\",handleRoot);\n  server.on(\"/api/status\",handleStatus); server.on(\"/api/themes\",handleThemes); server.on(\"/api/settings\",HTTP_POST,handleSettings);\n  server.on(\"/api/upload\", HTTP_POST, [](){}, handleUpload);\n  server.begin();\n  if(chronosOn) watch.begin();\n}\nvoid loop(){\n  server.handleClient(); if(chronosOn) watch.loop();"""
          new_s = """  apPass = MOCHI_AP_PASS;\n  WiFi.mode(WIFI_AP);\n  WiFi.softAPConfig(IPAddress(192,168,4,1), IPAddress(192,168,4,1), IPAddress(255,255,255,0));\n  WiFi.softAP(MOCHI_AP_NAME, MOCHI_AP_PASS);\n  dnsServer.start(53, \"*\", WiFi.softAPIP());\n  server.on(\"/\",handleRoot);\n  server.on(\"/index.html\",handleRoot);\n  server.on(\"/generate_204\",handleCaptiveProbe);\n  server.on(\"/hotspot-detect.html\",handleCaptiveProbe);\n  server.on(\"/ncsi.txt\",handleCaptiveProbe);\n  server.on(\"/api/status\",handleStatus);\n  server.on(\"/api/themes\",handleThemes);\n  server.on(\"/api/settings\",HTTP_POST,handleSettings);\n  server.on(\"/api/upload\", HTTP_POST, [](){}, handleUpload);\n  server.onNotFound(handleNotFound);\n  server.begin();\n  if(chronosOn) watch.begin();\n}\nvoid loop(){\n  dnsServer.processNextRequest();\n  server.handleClient(); if(chronosOn) watch.loop();"""
          if "dnsServer.start" not in main:
              if old_s not in main:
                  raise SystemExit("setup block not found")
              main = main.replace(old_s, new_s)
          main = main.replace("0.4.5 — upload", "0.4.8 — captive DNS")
          Path("firmware/src/main.cpp").write_text(main)
          print("patched", len(main))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/src/main.cpp
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(firmware): restore main.cpp + captive DNS portal (v0.4.8)"
            git push
          fi
