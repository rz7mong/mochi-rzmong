name: Import official STL
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-stl.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify STL
        run: |
          mkdir -p case
          curl -L --fail -o case/tatakan_lcd_23_40mm.stl https://litter.catbox.moe/1czpwg.stl
          curl -L --fail -o case/case_luar_lcd_23_40mm.stl https://litter.catbox.moe/bkopc4.stl
          echo "e7cb5f36cdfa9a80eeee2d84d75ac1401392979c6856be5d68bfa08a251b35fd  case/tatakan_lcd_23_40mm.stl" | sha256sum -c
          echo "44e262f38ddca51fe1e8a2eddd9073766faf2cbf38e16f61b20599a94cafb3b1  case/case_luar_lcd_23_40mm.stl" | sha256sum -c
          ls -la case/
      - name: Commit STL + README
        run: |
          git config user.name rzmong-bot
          git config user.email rz7mong@users.noreply.github.com
          cat > case/README.md << 'EOF'
# Case Mochi rzmong — model terbaru

Target hardware **2026**: ESP32-C3 Super Mini + LCD ST7789 **1.3\" 240×240** modul **23×40 mm**.

File cetak 3D resmi:

- [case_luar_lcd_23_40mm.stl](./case_luar_lcd_23_40mm.stl) — kulit luar (1.4 MB)
- [tatakan_lcd_23_40mm.stl](./tatakan_lcd_23_40mm.stl) — dudukan LCD 23×40 mm (794 KB)

Raw download:

- https://github.com/rz7mong/mochi-rzmong/raw/main/case/case_luar_lcd_23_40mm.stl
- https://github.com/rz7mong/mochi-rzmong/raw/main/case/tatakan_lcd_23_40mm.stl

## Cetak

- Material: PLA (PETG jika dekat TP4056 yang hangat)
- Layer 0.2 mm, dinding 2, infill 15–20%
- Support: biasanya tidak perlu

## Isi case yang muat

ESP32-C3 Super Mini, ST7789 1.3\" 8-pin, TP4056 + proteksi, MAX98357A, TTP223, LiPo pipih 400–800 mAh, speaker tipis 4–8 Ω, microSD SPI opsional.

Tidak muat: PAM8403, ESP32 DevKit besar, LCD 1.54\".

Panduan rakit: https://rz7mong.github.io/mochi-rzmong/hardware.html
EOF
          git add case/case_luar_lcd_23_40mm.stl case/tatakan_lcd_23_40mm.stl case/README.md
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "add: official case STL 23x40mm"
          git pull --rebase origin main || true
          git push origin HEAD:main
