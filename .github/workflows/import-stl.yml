name: Import official STL
on:
  push:
    paths:
      - '.github/workflows/import-stl.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download STL
        run: |
          mkdir -p case
          curl -fsSL -o case/tatakan_lcd_23_40mm.stl https://litter.catbox.moe/1czpwg.stl
          curl -fsSL -o case/case_luar_lcd_23_40mm.stl https://litter.catbox.moe/bkopc4.stl
          echo e7cb5f36cdfa9a80eeee2d84d75ac1401392979c6856be5d68bfa08a251b35fd  case/tatakan_lcd_23_40mm.stl | sha256sum -c
          echo 44e262f38ddca51fe1e8a2eddd9073766faf2cbf38e16f61b20599a94cafb3b1  case/case_luar_lcd_23_40mm.stl | sha256sum -c
          ls -la case/*.stl
      - name: Commit STL
        run: |
          git config user.name rzmong-bot
          git config user.email rz7mong@users.noreply.github.com
          git add case/tatakan_lcd_23_40mm.stl case/case_luar_lcd_23_40mm.stl
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "add: official case STL 23x40mm"
          git pull --rebase origin main || true
          git push origin HEAD:main
